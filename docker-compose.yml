services:
  app:
    build: .
    container_name: financial-analysis
    env_file: .env
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    tty: true
    restart: unless-stopped

  web:
    build: ./web
    container_name: financial-web
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      FILE_SHARE_PATH: data/financials
      VALUATION_PDF_PATH: data/valuation_parameters.pdf
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    restart: unless-stopped
